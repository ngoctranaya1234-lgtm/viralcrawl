name: Publish 2TECH MN public interface
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check public JavaScript
        run: |
          for file in js/*.mjs js/pages/*.mjs server.js sw.js; do node --check "$file"; done
      - name: Run unit tests
        run: npm test
      - name: Verify public safety release gate
        run: npm run verify:public
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E release gate smoke tests
        run: npm run test:e2e
      - name: Stage public assets only from explicit allowlist
        run: |
          mkdir _site
          cp index.html manifest.json sw.js _site/
          mkdir -p _site/css _site/assets _site/js/pages
          cp css/*.css _site/css/
          cp assets/* _site/assets/
          cp js/*.mjs _site/js/
          cp js/pages/*.mjs _site/js/pages/
          touch _site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy public interface
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
