<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ViralCrawl 4K — 2TECH MN (Nguyễn Minh Nhựt)</title>
  <meta name="description" content="Công cụ tải video 4K 60FPS mọi nền tảng không logo bản quyền 2TECH MN">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ViralCrawl 4K">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2310b981'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-weight='bold'>4K</text></svg>">
</head>
<body>

<div class="app-layout" id="app">
  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">V</div>
      <div>
        <div class="brand-text">ViralCrawl</div>
        <div style="font-size:10px;color:var(--text-muted);letter-spacing:0.04em;">by 2TECH MN</div>
      </div>
    </div>

    <div class="sidebar-user" id="sidebarUser" style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;">
      <div id="userAvatar" style="width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;">?</div>
      <div style="flex:1;min-width:0;">
        <div id="userName" style="font-size:12px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Chưa đăng nhập</div>
        <div id="userBalance" style="font-size:11px;color:var(--success);font-family:var(--font-mono);">0đ</div>
      </div>
      <button class="btn btn-sm btn-ghost" id="btnLogin" title="Đăng nhập" aria-label="Đăng nhập" style="font-size:11px;padding:4px 10px;">Đăng nhập</button>
    </div>

    <nav class="sidebar-nav" id="sidebarNav">
      <div class="sidebar-section">Nguồn video</div>

      <button class="sidebar-item active" data-page="dashboard" aria-label="Tải ngay" title="Tải ngay">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
        Tải ngay
      </button>

      <button class="sidebar-item" data-page="download-link" aria-label="Tải video bằng link" title="Tải video bằng link">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
        Tải video bằng link
      </button>

      <div class="sidebar-section">Thư viện</div>

      <button class="sidebar-item" data-page="downloaded" aria-label="File đã tải" title="File đã tải">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>
        File đã tải
        <span class="sidebar-badge" id="badgeDownloaded">8</span>
      </button>

      <button class="sidebar-item" data-page="history" aria-label="Lịch sử tải" title="Lịch sử tải">
        <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
        Lịch sử tải
      </button>

      <div class="sidebar-footer-section">
        <button class="sidebar-item" data-page="settings" aria-label="Cài đặt" title="Cài đặt">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span>
          Cài đặt
        </button>

        <button class="sidebar-item" data-page="pricing" aria-label="Bảng Giá" title="Bảng Giá">
          <span class="icon"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
          Bảng Giá
        </button>

        <button class="sidebar-item" data-page="support" aria-label="Gửi câu hỏi" title="Gửi câu hỏi">
          <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>
          Gửi câu hỏi
        </button>
      </div>
    </nav>
  </aside>

  <!-- ═══ HEADER ═══ -->
  <header class="app-header">
    <div class="flex items-center gap-3">
      <button class="btn btn-icon btn-ghost btn-sm" id="menuToggle" aria-label="Menu" title="Menu" style="display:none;">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 class="header-title" id="pageTitle">Tải ngay</h1>
    </div>
    <div class="header-actions">
      <div class="badge badge-neutral" id="btnDeviceMode" style="cursor:pointer;" title="Bấm để đổi chế độ giao diện (Auto / iOS / Android / Desktop)">
        <span id="deviceIcon">📱</span> <span id="deviceText" class="font-mono text-xs">Auto Detect</span>
      </div>
      <span class="badge-4k">4K 60FPS</span>
      <button class="btn btn-ghost btn-sm" id="btnMute" aria-label="Tắt âm thanh" title="Tắt âm thanh">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
      <div class="badge badge-neutral" id="headerBalance" style="cursor:pointer;" onclick="App.navigate('pricing')" title="Số dư tài khoản">
        <span style="font-size:11px;">💰</span> <span id="headerBalanceAmount" class="font-mono" style="font-size:11px;">0đ</span>
      </div>
      <div class="badge badge-success"><span class="badge-dot green"></span> Sẵn sàng</div>
    </div>
  </header>

  <!-- ═══ STEPPER BAR ═══ -->
  <div class="stepper-bar" id="stepperBar">
    <div class="stepper-step completed" data-step="1">
      <span class="stepper-num">✓</span>
      <span>1. Đăng nhập</span>
    </div>
    <div class="stepper-line"></div>
    <div class="stepper-step active" data-step="2">
      <span class="stepper-num">2</span>
      <span>2. Chọn nền tảng</span>
    </div>
    <div class="stepper-line"></div>
    <div class="stepper-step" data-step="3">
      <span class="stepper-num">3</span>
      <span>3. Tải 4K 60FPS</span>
    </div>
    <div class="stepper-line"></div>
    <div class="stepper-step" data-step="4">
      <span class="stepper-num">4</span>
      <span>4. Hoàn tất</span>
    </div>
  </div>

  <!-- ═══ MAIN CONTENT ═══ -->
  <main class="app-main" id="mainContent">
    <!-- Page content injected here by JS -->
    <div class="empty-state">
      <div class="empty-icon">⏳</div>
      <div class="empty-title">Đang tải giao diện 4K...</div>
    </div>
  </main>

  <!-- ═══ FOOTER TICKER ═══ -->
  <footer class="app-footer">
    <span class="footer-dot"></span>
    <span id="footerStatus">Đang chờ lệnh — 2TECH MN ViralCrawl 4K Studio</span>
    <span style="margin-left:auto;font-family:var(--font-mono);" id="footerUptime">0m 0s</span>
  </footer>
</div>

<!-- ═══ MOBILE BOTTOM NAVIGATION BAR (Android & iOS) ═══ -->
<nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="Điều hướng di động">
  <button class="mobile-nav-item active" data-page="dashboard" title="Tải ngay">
    <span class="mobile-nav-icon"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
    <span class="mobile-nav-label">Tải 4K</span>
  </button>
  <button class="mobile-nav-item" data-page="download-link" title="Tải bằng link">
    <span class="mobile-nav-icon"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
    <span class="mobile-nav-label">Tải link</span>
  </button>
  <button class="mobile-nav-item" data-page="downloaded" title="Thư viện video">
    <span class="mobile-nav-icon"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>
    <span class="mobile-nav-label">Thư viện</span>
    <span class="mobile-nav-badge" id="mobileBadgeCount">0</span>
  </button>
  <button class="mobile-nav-item" data-page="pricing" title="Gói cước VIP">
    <span class="mobile-nav-icon"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
    <span class="mobile-nav-label">Gói VIP</span>
  </button>
  <button class="mobile-nav-item" data-page="settings" title="Cài đặt">
    <span class="mobile-nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
    <span class="mobile-nav-label">Cài đặt</span>
  </button>
</nav>

<!-- ═══ MODAL OVERLAY ═══ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent" role="dialog" aria-modal="true">
    <!-- Dynamic modal content -->
  </div>
</div>

<!-- ═══ SCRIPTS ═══ -->
<script src="./js/engine-resolver.js"></script>
<script src="./js/app.js"></script>
<script src="./js/page-dashboard.js"></script>
<script src="./js/page-download-link.js"></script>
<script src="./js/page-downloaded.js"></script>
<script src="./js/page-history.js"></script>
<script src="./js/page-settings.js"></script>
<script src="./js/page-pricing.js"></script>
<script src="./js/page-support.js"></script>
<script>
  // Boot the application once all page scripts are loaded
  document.addEventListener('DOMContentLoaded', () => {
    App.init();

    // Register PWA Service Worker for Mobile (Android & iOS)
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('./sw.js').then(() => {
        console.log('PWA Service Worker registered successfully.');
      }).catch(err => console.warn('SW registration skipped:', err));
    }
  });
</script>
</body>
</html>
